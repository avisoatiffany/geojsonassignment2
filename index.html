<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Tiffany Ratsizafy">
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
       
        <title>Stroll TO</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            
            #map-container {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100vh;
            }
            
             #top-bar {
                display: flex;
                flex-wrap: nowrap;
                align-items: center; 
                justify-content: space-between;
                box-sizing: border-box;
                z-index: 1000;
                flex-shrink: 0;

                gap: 5px;
                width: 100%;
                padding: 5px 20px;
                background-color: #EEEEEE; 
            }

            #title-container h1 {
                font-size: 24px;
            }           

            #search-bar {
                display: flex;
                position: relative;
                align-items: center;
                font-size: 18px;
            }

            #search {
                padding: 10px 15px;
                width: 300px;
                box-sizing: border-box;
                border: 5px solid #EEEEEE;
                border-radius: 100vh;
                transition: background-color 0.3s ease, border-color 0.2s ease;
            }

            #search:hover, search:focus {
                background-color: #EAE2D6;
                border-color: #EFE9E3;
            }

            #map {
                width: 100%;
                flex-grow: 1;
            }

            @media (max-width: 768px){
                #top-bar{
                    flex-direction: column;
                    align-items: stretch;
                }
                #map-container {
                    height: calc(100vh - 120px);
                }
            }

            
        </style>

    </head> 
   
    <body>        
       
        <div id = "map-container">
            <div id = "top-bar">

                <div id = "title-container">
                    <h1>StrollTO Project</h1>
                </div>
                    
                <div id = "search-bar">
                    <input type = "text" id="search" placeholder="Search..." autocomplete="off" /></div> 
            </div>
    
            <div id = "map"></div>
        </div>
        
        <script>
            var map = L.map('map').setView([43.642567, -79.387054], 14);
            L.tileLayer('https://api.maptiler.com/maps/openstreetmap/256/{z}/{x}/{y}.jpg?key=pvAYR61jpF66DNdIbXKL', {
                maxZoom: 18,
                attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            }).addTo(map);

            fetch('data/strollto.geojson')
                .then(response => response.json())
                .then(data => {
                    L.geoJSON(data).addTo(map);
                });

            
        </script>

        
    </body>
</html>
