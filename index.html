<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Tiffany Ratsizafy">
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
       
        <title>Stroll TO Project</title>
		
        <style>
            html, body {
				height: 100%;
				margin: 0;
				padding: 0;
				font-family: Arial, sans-serif;
			}
			
			#app-container{}
			
			#top-bar{}
			
			#title-container h1{} 
			
			#controls-container{}
			
			#search-bar{} 
			
			#search{}
			
			#search-bar{}
			
			#reset-btn:hover{}
			
			#search:hover, #search:focus{}
			
			#main-content{}
			
			#map{}
			
			#info-panel{}
			
			#info-panel h2{}
			
			
			
			@media (max-width: 768px){
				#top-bar{}
				
				#controls-container{} 
				
				#search, #reset-btn{} 
				
				#main-content{}
				
				#map{}
				
				#info-panel{}
			}
        </style>
		
    </head> 
   
    <body>       
		<div id ="app-container">
			<div id="top-bar">
				<h1>Scroll Toronto Project</h1>
				<div id="controls-container">
					<div id="search-bar">
						<input type="text" id="search" placeholder="Search by Neighbourhood..." autocomplete=off>
					</div>
					<button id="reset-btn" onclick=resetMap()"Reset Map"</button>
				</div>
			</div>
				
			<div id="main-content">
				<div id="map"></div>
				<div id="info-panel">
					<h2 id="panel-title">Neighbourhood Details</h2>
					<div id="panel-content">
						<p class="placeholder-text">Click on a neighbourhood boundary to explore StrollTO locations.</p>
					</div>
				</div>
			</div>
		</div> 
		
		
		<script>
			
			// Link to MapTiler and set up variables
			var map = L.map('map').setView([43.717864, -79.348984], 11);
            
            L.tileLayer('https://api.maptiler.com/maps/openstreetmap/256/{z}/{x}/{y}.jpg?key=pvAYR61jpF66DNdIbXKL', {
                maxZoom: 18,
                attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            }).addTo(map);

            setTimeout(function() {
                map.invalidateSize();
            }, 200);
            
            let strollPointsData = null;
            let boundaryData = null;
            let boundaryLayer = null; 

			function renderBoundaryLayer(geojsonData) {
                if (boundaryLayer) {
                    map.removeLayer(boundaryLayer);
                }
                
                boundaryLayer = L.geoJSON(geojsonData, {
                    style: {
                        color: '#76453B',
                        weight: 2,
                        fillColor: '#4C2365',
                        fillOpacity: 0.20
                    },
                    
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties;
                        const name = props.AREA_NAME || props.Neighbourhood || 'Neighborhood';
                        
                        // Set popup centered slightly above the neighborhood feature
                        layer.bindPopup(`<b>Neighbourhood Boundary:</b> ${name}`, {
                            offset: [0, -10]
                        });

                        layer.on('click', function(e) {
                            boundaryLayer.resetStyle();
                            
                            // Highlight selected neighborhood polygon
                            e.target.setStyle({
                                fillOpacity: 0.50
                            });

                            // Zoom to selected neighborhood
                            map.fitBounds(e.target.getBounds(), {
                                padding: [30, 30],
                                maxZoom: 14
                            });
                            
                            // Open popup on map
                            layer.openPopup();

                            // Populate panel on the right side with linked point data
                            updateSidePanel(name);

                            L.DomEvent.stopPropagation(e.originalEvent);
                        });
                    }
                }).addTo(map);
            }

			
			// Fetch GeoJSON files and adding error messages 
            Promise.all([
                fetch('data/StrollTO4326.geojson'),
                fetch('data/Neighbourhoods%20-%204326%20(2).geojson')
            ])
            .then(async function([strollResponse, neighbourhoodResponse]) {
                if (!strollResponse.ok) {
                    throw new Error("StrollTO file not found");
                }
                if (!neighbourhoodResponse.ok) {
                    throw new Error("Neighbourhood file not found");
                }
            
                const strollData = await strollResponse.json();
                const neighbourhoodData = await neighbourhoodResponse.json();
            
                strollPointsData = strollData;
                boundaryData = neighbourhoodData;
            
                renderBoundaryLayer(boundaryData);
            })
            .catch(function(error) {
                console.error("ERROR:", error);
                alert("Problem loading your map data: " + error.message);
            });

			function resetMap() {
                map.setView([43.717864, -79.348984], 11);
                document.getElementById('search').value = '';
                
                document.getElementById('panel-title').innerText = 'Neighborhood Details';
                document.getElementById('panel-content').innerHTML = '<p class="placeholder-text">Click on a neighborhood boundary to explore StrollTO locations.</p>';
                
                renderBoundaryLayer(boundaryData);
            }
		</script>
        
    </body>
</html>
