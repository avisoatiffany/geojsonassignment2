<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Tiffany Ratsizafy">
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
       
        <title>Stroll TO</title>

        <!-- 1. Styling html and adjusting for different screen sizes -->
        <style> 
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            
            #map-container {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100vh;
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                overflow: hidden
            }
            
             #top-bar {
                display: flex;
                flex-wrap: nowrap;
                align-items: center; 
                justify-content: space-between;
                box-sizing: border-box;
                z-index: 1000;
                flex-shrink: 0;

                gap: 5px;
                width: 100%;
                padding: 5px 20px;
                background-color: #EEEEEE; 
            }

            #title-container h1 {
                font-size: 24px;
            }      

            #controls-container {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            #search-bar {
                display: flex;
                position: relative;
                align-items: center;
                font-size: 18px;
            }

            #search {
                padding: 10px 15px;
                width: 300px;
                box-sizing: border-box;
                border: 5px solid #EEEEEE;
                border-radius: 100vh;
                transition: background-color 0.3s ease, border-color 0.2s ease;
            }

            #reset-btn {
                padding: 10px 20px;
                background-color: #EFE9E3;
                border: none;
                border-radius: 100vh;
                cursor: pointer;
                font-size: 15px;
                font-weight: bold;
                color: #4C2365;
                transition: background-color 0.2s ease;
            }

            #reset-btn:hover {
                background-color: #dcd6df;
            }
            
            #search:hover, #search:focus {
                background-color: #EFE9E3;
                border-color: #EFE9E3;
            }

            #map {
                width: 100%;
                flex-grow: 1;
                min-height: 0;
            }

            @media (max-width: 768px){
                #top-bar{
                    flex-direction: column;
                    align-items: stretch;
                }
                
                 #controls-container {
                    flex-direction: column;
                    width: 100%;
                    gap: 10px;
                    padding-bottom: 10px;
                }

                #search-bar {
                    width: 100%;
                }
                
                #search, #reset-btn {
                    width: 100%;
                    box-sizing: border-box;
                    padding: 5px;
                }
            }
            
        </style>
    </head> 

    <body>        
    <!-- 2. Setting up the different boxes and containers for custom elements-->
        <div id = "map-container">
            <div id = "top-bar">
                <div id = "title-container">
                    <h1>StrollTO Project</h1>
                </div>
                <div id="controls-container">
                    <div id="search-bar">
                        <input type="text" id="search" placeholder="Search by Neighborhood..." autocomplete="off"></div>
                    <button id="reset-btn" onclick="resetMap()"> Reset Map</button>
                </div>
            </div>
            <div id = "map"></div>
        </div>
    <!-- 3. Adding JS functions -->
        <script>
            var map = L.map('map').setView([43.717864, -79.348984], 11);
            L.tileLayer('https://api.maptiler.com/maps/openstreetmap/256/{z}/{x}/{y}.jpg?key=pvAYR61jpF66DNdIbXKL', {
                maxZoom: 18,
                attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            }).addTo(map);
 
            setTimeout(function() {
                map.invalidateSize();
            }, 200);

            window.addEventListener('resize', function() {
                map.invalidateSize({ pan: false });
            });
            
            let strollPointsData = null;
            let boundaryData = null;

            let pointsLayer = null;
            let boundaryLayer = null; 

            // 4. Defining marker using Leaflet
            var icon = L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                iconSize: [15, 20],
                iconAnchor: [6, 20],
                popupAnchor: [1, -17],
                
                shadowSize: [12, 12],
                shadowAnchor: [6, 12]
            });

            // 5. Shared popup configuration for boundary behaviour
            const popupOptions = {
                maxWidth: 260,
                maxHeight: 180,
                autoPan: true,
                autoPanPadding: [30, 30],
                keepInView: true
            }

            // 6. Render neighbourhood boundaries and JS features
            function renderBoundaryLayer(geojsonData) {
                if (boundaryLayer) {
                    map.removeLayer(boundaryLayer);
                }
                
                boundaryLayer = L.geoJSON(geojsonData, {
                    style: {
                        color: '#76453B',
                        weight: 2,
                        fillColor: '#4C2365',
                        fillOpacity: 0.20
                    },

                    // 7. Setup pop-up feature and responsive JS function
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties;
                        const name = props.AREA_NAME;
                        
                        if (name) { 
                            layer.bindPopup(`<b>Neighbourhood Boundary:</b> ${name}` , 
                                popupOptions
                            );
                        }
                        layer.on('click', function(e) {
                            boundaryLayer.resetStyle();
                            e.target.setStyle({
                                fillOpacity: 0.50});
                            map.fitBounds(e.target.getBounds(), {
                                padding: [30,30],
                                maxZoom: 14
                        });
                            
                            L.DomEvent.stopPropagation(e.originalEvent);
                        });
                    }
                }).addTo(map);
            }

            // 7. Render neighbourhood boundaries and JS features
            function renderPointsLayer(geojsonData) {
                if (pointsLayer) {
                    map.removeLayer(pointsLayer);
                }
                pointsLayer = L.geoJSON(geojsonData, {
                    pointToLayer: function(feature, latlng) {
                        return L.marker(latlng, { icon: icon });
                    },

                // 
                onEachFeature: function(feature, layer) {
                    if (feature.properties && feature.properties.Neighbourhood) {
                        const neighbourhood = feature.properties.Neighbourhood;
                        const description = feature.properties.Description;
                        layer.bindPopup(`
                        <b>StrollTO Point:</b> ${feature.properties.Neighbourhood}
                        <p>${description}</p>
                        `, popupOptions);
                        } 
                        layer.on('click', function(e) {
                            map.flyTo(layer.getLatLng(), 14, {
                             duration: 0.8
                        });

                        L.DomEvent.stopPropagation(e.originalEvent);
                    });
                }
                }).addTo(map);
            }
                    
        
            // 
            Promise.all([
                fetch('data/StrollTO4326.geojson'),
                fetch('data/Neighbourhoods%20-%204326%20(2).geojson')
            ])
            .then(async function([strollResponse, neighbourhoodResponse]) {
            
                console.log("StrollTO status:", strollResponse.status);
                console.log("Neighbourhood status:", neighbourhoodResponse.status);
            
                if (!strollResponse.ok) {
                    throw new Error("StrollTO file not found");
                }
            
                if (!neighbourhoodResponse.ok) {
                    throw new Error("Neighbourhood file not found");
                }
            
                const strollData = await strollResponse.json();
                const neighbourhoodData = await neighbourhoodResponse.json();
            
                console.log("StrollTO features:", strollData.features.length);
                console.log("Neighbourhood features:", neighbourhoodData.features.length);
            
                strollPointsData = strollData;
                boundaryData = neighbourhoodData;
            
                renderBoundaryLayer(boundaryData);
                renderPointsLayer(strollPointsData);
            
            })
            .catch(function(error) {
                console.error("ERROR:", error);
                alert("Problem loading your map data: " + error.message);
            });
            
            // Search bar filtering
            const searchInput = document.getElementById('search');

            searchInput.addEventListener('input', function(e) {
                const keyword = e.target.value.toLowerCase().trim();

                if (!strollPointsData || !boundaryData) return;

               const filteredPoints = strollPointsData.features.filter(function(feature) {
                    const neighborhoodName = feature.properties.Neighbourhood ? String(feature.properties.Neighbourhood).toLowerCase() : '';
                    return neighborhoodName.includes(keyword);
                });

                const filteredBoundaries = boundaryData.features.filter(function(feature) {
                    const props = feature.properties;
                    const areaName = String(props.AREA_NAME || props.Neighbourhood || '').toLowerCase();
                    return areaName.includes(keyword);
                });

                renderBoundaryLayer({
                    type: "FeatureCollection",
                    features: filteredBoundaries
                });

                renderPointsLayer({
                    type: "FeatureCollection",
                    features: filteredPoints
                });
            });

            // Reset function
            function resetMap () {
                map.setView([43.717864, -79.348984], 11);
                document.getElementById('search').value = '';
                renderBoundaryLayer(boundaryData);
                renderPointsLayer(strollPointsData);  
            }
         
        </script>
        
    </body>
</html>
