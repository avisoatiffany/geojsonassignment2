<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Page metadata and link to Leaflet CSS and JS -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- viewport to device width --> 
        <meta name="author" content="Tiffany Ratsizafy">
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
       
        <title>Stroll TO</title>

        <style> 
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            
            #map-container {
                display: flex;
                flex-direction: column; 
                width: 100%;
                height: 100vh; /*using viewport height*/
                position: fixed; 
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                overflow: hidden 
            }
                
             #top-bar { 
                display: flex;
                flex-wrap: nowrap;
                align-items: center; 
                justify-content: space-between; 
                box-sizing: border-box;
                z-index: 1000;
                flex-shrink: 0; 

                gap: 5px;
                width: 100%;
                padding: 5px 20px;
                background-color: #EEEEEE; 
            }

            #title-container h1 { 
                font-size: 24px;
            }      

            #controls-container {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            #search-bar {
                display: flex;
                position: relative;
                align-items: center;
                font-size: 18px;
            }

            #search {
                padding: 10px 15px;
                width: 300px;
                box-sizing: border-box;
                border: 5px solid #EEEEEE;
                border-radius: 100vh;
                transition: background-color 0.3s ease, border-color 0.2s ease; /*adding style for smooth transition*/
            }

            #reset-btn {
                padding: 10px 20px;
                background-color: #EFE9E3;
                border: none;
                border-radius: 100vh;
                cursor: pointer;
                font-size: 15px;
                font-weight: bold;
                color: #4C2365;
                transition: background-color 0.2s ease;
            }

            #reset-btn:hover {
                background-color: #dcd6df; 
            }
            
            #search:hover, #search:focus { 
                background-color: #EFE9E3;
                border-color: #EFE9E3;
            }

            #map {
                width: 100%;
                flex-grow: 1; 
                min-height: 0; 
            }

            @media (max-width: 768px){ /*adjusts the topbar and search controls for smaller screen sizes */
                #top-bar{
                    flex-direction: column;
                    align-items: stretch;
                }
                
                 #controls-container {
                    flex-direction: column;
                    width: 100%;
                    gap: 10px;
                    padding-bottom: 10px;
                }

                #search-bar {
                    width: 100%;
                }
                
                #search, #reset-btn {
                    width: 100%;
                    box-sizing: border-box;
                    padding: 5px;
                }
            }
            
        </style>
    </head> 

    <body>        
  
        <div id = "map-container"> 
            <div id = "top-bar"> 
                <div id = "title-container"> 
                    <h1>StrollTO Project</h1>
                </div>
                <div id="controls-container"> 
                    <div id="search-bar">
                        <input type="text" id="search" placeholder="Search by Neighborhood..." autocomplete="off"></div>
                    <button id="reset-btn" onclick="resetMap()"> Reset Map</button>
                </div>
            </div>
            <div id = "map"></div>
        </div>
    
        <script>
           //initializes the Leaflet map centered on Toronto  
            var map = L.map('map').setView([43.717864, -79.348984], 11); 
            L.tileLayer('https://api.maptiler.com/maps/openstreetmap/256/{z}/{x}/{y}.jpg?key=pvAYR61jpF66DNdIbXKL', { 
                maxZoom: 18,
                attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            }).addTo(map);
 
            window.addEventListener('resize', function() { //Recalculates the map dimensions when the browser window is resized
                map.invalidateSize({ pan: false });
            });
           
            let strollPointsData = null; //original GeoJSON data from the City of Toronto and is in the Github folder
            let boundaryData = null; 
            
            let pointsLayer = null; //Leaflet layers for markers and polygons
            let boundaryLayer = null; 

            // Defining marker using Leaflet library
            var icon = L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                iconSize: [15, 20],
                iconAnchor: [6, 20],
                popupAnchor: [1, -17],
                
                shadowSize: [12, 12],
                shadowAnchor: [6, 12]
            });

            // Shared popup setting for boundary behaviour
            const popupOptions = {
                maxWidth: 260,
                maxHeight: 180,
                autoPan: true, 
                autoPanPadding: [30, 30],
                keepInView: true // from Leaflet library so that the map automatically stays in view
            }

            // Render neighbourhood boundaries and JS features
            function renderBoundaryLayer(geojsonData) { 
                if (boundaryLayer) {
                    map.removeLayer(boundaryLayer);
                }
                
                boundaryLayer = L.geoJSON(geojsonData, {
                    style: {
                        color: '#76453B',
                        weight: 2,
                        fillColor: '#4C2365',
                        fillOpacity: 0.20
                    },

                    // Adding interactive popups and click events to each neighbourhood boundary polygon
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties;
                        const name = props.AREA_NAME;
                        // Displays the neighbourhood name when clicking within the boundary/polygon
                        if (name) { 
                            layer.bindPopup(`<b>Neighbourhood Boundary:</b> ${name}` , 
                                popupOptions
                            );
                        }
                        // Highlights the selected neighoubhood and zoomes to its geographic boundaries
                        layer.on('click', function(e) { 
                            boundaryLayer.resetStyle();
                            e.target.setStyle({
                                fillOpacity: 0.50});
                             // Automatically adjust the map view to the selected polygon
                            map.fitBounds(e.target.getBounds(), { 
                                padding: [30,30],
                                maxZoom: 14
                        });
                        
                            L.DomEvent.stopPropagation(e.originalEvent);
                        });
                    }
                }).addTo(map);
            }

            // Creates GeoJSON layer containing clickable StrollTO location markers
            function renderPointsLayer(geojsonData) {
                if (pointsLayer) {
                    map.removeLayer(pointsLayer);
                }
                //converting each GeoJSON point into a Leaflet marker
                pointsLayer = L.geoJSON(geojsonData, {
                    pointToLayer: function(feature, latlng) {
                        return L.marker(latlng, { icon: icon });
                    },

                // adds a popup containing the StrollTO neighbourhood and description
                onEachFeature: function(feature, layer) {
                    if (feature.properties && feature.properties.Neighbourhood) {
                        const neighbourhood = feature.properties.Neighbourhood;
                        const description = feature.properties.Description;
                        layer.bindPopup(`  
                        <b>StrollTO Point:</b> ${feature.properties.Neighbourhood}
                        <p>${description}</p>
                        `, popupOptions);
                        } 
                         // smoothly zooms to the selected StrollTO locations
                        layer.on('click', function(e) {
                            map.flyTo(layer.getLatLng(), 14, {
                             duration: 0.8
                        });

                        L.DomEvent.stopPropagation(e.originalEvent);
                    });
                }
                }).addTo(map);
            }
        
            // loads both GeoJSON datasets at the same time for the map layers
            
            fetch('data/StrollTO4326.geojson'),
            fetch('data/Neighbourhoods%20-%204326%20(2).geojson')
            .then(async function([strollResponse, neighbourhoodResponse]) {     // Converts both fetched responses into JS objects
            
                console.log("StrollTO status:", strollResponse.status);
                console.log("Neighbourhood status:", neighbourhoodResponse.status);
            
                if (!strollResponse.ok) {
                    throw new Error("StrollTO file not found");
                }
            
                if (!neighbourhoodResponse.ok) {
                    throw new Error("Neighbourhood file not found");
                }
                
                const strollData = await strollResponse.json();
                const neighbourhoodData = await neighbourhoodResponse.json();
            
                console.log("StrollTO features:", strollData.features.length);
                console.log("Neighbourhood features:", neighbourhoodData.features.length);
                // Stores the GeoJSON datafor search and rendering functions
                strollPointsData = strollData;
                boundaryData = neighbourhoodData;

                // display the neighbourhood bonudaries and strollto markers on the map
                renderBoundaryLayer(boundaryData); 
                renderPointsLayer(strollPointsData);
            })
            .catch(function(error) {
                console.error("ERROR:", error);
                alert("Problem loading your map data: " + error.message);
            });
            
            // dynamically filters both map layers based on the input element in the HTML 
            const searchInput = document.getElementById('search');
            // listens for user input and filters map features dynamically
            searchInput.addEventListener('input', function(e) { 
                const keyword = e.target.value.toLowerCase().trim(); 
                // cheacking that both datasets loaded properly
                if (!strollPointsData || !boundaryData) return;
                // filters StrollTO locations based on their neighbour names
               const filteredPoints = strollPointsData.features.filter(function(feature) {
                    const neighborhoodName = feature.properties.Neighbourhood ? String(feature.properties.Neighbourhood).toLowerCase() : '';
                    return neighborhoodName.includes(keyword);
                });
                // filters neighbourhood boundaries based on their names
                const filteredBoundaries = boundaryData.features.filter(function(feature) {
                    const props = feature.properties;
                    const areaName = String(props.AREA_NAME || props.Neighbourhood || '').toLowerCase();
                    return areaName.includes(keyword);
                });
                // updates the boundary layer with matching results 
                renderBoundaryLayer({
                    type: "FeatureCollection",
                    features: filteredBoundaries
                });
                // updates the points layer with matching results
                renderPointsLayer({
                    type: "FeatureCollection",
                    features: filteredPoints
                });
            });

            // restores the original map extent and clears the search
            function resetMap () {
                map.setView([43.717864, -79.348984], 11); // resets to the initial map extent
                document.getElementById('search').value = ''; 
                // restores all original neighbourhood boundaries and StrollTO points
                renderBoundaryLayer(boundaryData); 
                renderPointsLayer(strollPointsData);  
            }
         
        </script>
        
    </body>
</html>
